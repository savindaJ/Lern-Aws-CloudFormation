service: cloud-formation-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  architecture: x86_64
  environment:
    STAGE: ${self:provider.stage}
    USE_BEDROCK: ${self:custom.useBedrock.${self:provider.stage}, 'false'}
    BEDROCK_MODEL_ID: ${self:custom.bedrockModelId}
  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization

plugins:
  - serverless-python-requirements

custom:
  bedrockModelId: anthropic.claude-3-haiku-20240307-v1:0
  useBedrock:
    dev: "false"
    staging: "false"
    prod: "true"
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    fileName: requirements.txt

functions:
  health:
    name: cloud-formation-api-${self:provider.stage}-health
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: get

  aiChat:
    name: cloud-formation-api-${self:provider.stage}-ai-chat
    handler: src/handlers/ai_chat.handler
    events:
      - httpApi:
          path: /ai/chat
          method: post
    iamRoleStatements:
      - Effect: Allow
        Action:
          - bedrock:InvokeModel
        Resource: "*"

package:
  patterns:
    - "!node_modules/**"
    - "!.serverless/**"
    - "!infra/**"
    - "!**/__pycache__/**"

resources:
  Outputs:
    ApiEndpoint:
      Description: API Gateway base URL
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    HealthUrl:
      Description: Health check URL
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
    AiChatUrl:
      Description: AI chat URL
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/ai/chat"
    HttpApiId:
      Value: !Ref HttpApi
